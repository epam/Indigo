name: bingo-postgres-wal

x-postgres-environment: &postgres-environment
  POSTGRES_DB: test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-postgres-command: &postgres-command
  - postgres
  - -c
  - wal_level=replica
  - -c
  - max_wal_senders=10
  - -c
  - max_replication_slots=10
  - -c
  - hot_standby=on
  - -c
  - fsync=on
  - -c
  - full_page_writes=on

services:
  primary:
    build:
      context: ../../../..
      dockerfile: bingo/postgres/tests/docker/Dockerfile
      target: postgres-bingo
    image: bingo-postgres-wal-test:local
    environment: *postgres-environment
    command: *postgres-command
    ports:
      - "${BINGO_TEST_PRIMARY_PORT:-55432}:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 1s
      timeout: 3s
      retries: 60

  runner:
    image: bingo-postgres-wal-test:local
    profiles: ["tools"]
    depends_on:
      primary:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      PGHOST: primary
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      WORKERS: ${WORKERS:-8}
      ROWS: ${ROWS:-6000}
    entrypoint: ["/opt/bingo-harness/run-suite.sh"]
    command: ["normal"]

  standby:
    image: bingo-postgres-wal-test:local
    profiles: ["replica"]
    depends_on:
      primary:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      PRIMARY_HOST: primary
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    entrypoint: ["/opt/bingo-harness/standby-entrypoint.sh"]
    volumes:
      - standby-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 1s
      timeout: 3s
      retries: 90

  replica-test:
    image: bingo-postgres-wal-test:local
    profiles: ["replica"]
    depends_on:
      primary:
        condition: service_healthy
      standby:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      PGPASSWORD: postgres
      PRIMARY_DSN: "host=primary port=5432 dbname=test user=postgres"
      STANDBY_DSN: "host=standby port=5432 dbname=test user=postgres"
      WAIT_SECONDS: ${WAIT_SECONDS:-120}
      ROWS: ${ROWS:-6000}
    entrypoint: ["/opt/bingo-harness/run-suite.sh"]
    command: ["replica"]

  crash-test:
    image: bingo-postgres-wal-test:local
    profiles: ["crash"]
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      BINGO_WAL_TEST_ALLOW_CRASH: "1"
      ROWS: ${CRASH_ROWS_BASELINE:-50000}
      CRASH_ROWS: ${CRASH_ROWS:-150000}
      CRASH_DELAY: ${CRASH_DELAY:-0.20}
    entrypoint: ["/opt/bingo-harness/crash-entrypoint.sh"]
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  primary-data:
  standby-data:
